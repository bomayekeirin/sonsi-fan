<body>

<header class="head is-solid">
  <a class="head__brand" href="/" aria-label="Sonsi ファンサイト トップ">

  </a>
  <div class="head__right">
    <a class="head__back" href="/">トップへ</a>
  </div>
</header>

<main class="sec" id="board">
  <div class="sec__head"><h2>BOARD</h2><span class="ja">Sonsiファン掲示板</span></div>

  <div id="boardAuth" class="board__auth"></div>

  <div id="boardForm" class="board__form" hidden>
    <textarea id="boardInput" class="board__input" rows="3" maxlength="600"
      placeholder="いま聴いてる曲、ライブの感想、なんでも。"></textarea>
    <div id="boardUpload" class="board__uploadbox" hidden></div>
    <div class="board__formfoot">
      <span id="boardCount" class="board__count">0 / 500</span>
      <button id="boardSubmit" class="board__submit">投稿する</button>
    </div>
  </div>

  <p id="boardNotice" class="board__notice"></p>
  <div id="boardList" class="board__list"></div>

  <p class="board__rule">
    誹謗中傷・個人情報・本人や関係者への迷惑になる投稿は削除します。<br>
    詳しくは<a href="/terms.html">利用規約</a>をご確認ください。
  </p>
</main>
